<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出会いのプロローグ — オフライン試作</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#090d21;color:#fff;display:grid;place-items:center}.stage{width:min(100%,460px);min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 65% 30%,#4b3a70,transparent 45%),linear-gradient(#101833,#0a1125 70%,#1a1428);display:flex;flex-direction:column;justify-content:space-between;padding:28px 22px 20px;text-align:center}.stage.cool{background:radial-gradient(ellipse at 65% 30%,#1c5674,transparent 45%),linear-gradient(#09182c,#101d30 70%,#11192b)}.stage.sun{background:radial-gradient(ellipse at 65% 30%,#b77641,transparent 45%),linear-gradient(#483351,#493454 70%,#3b2940)}.skyline{position:absolute;inset:auto 0 0;height:30%;opacity:.45;background:repeating-linear-gradient(90deg,transparent 0 13px,#05091b 13px 33px,transparent 33px 44px,#070b1a 44px 70px);clip-path:polygon(0 35%,8% 35%,8% 15%,17% 15%,17% 43%,28% 43%,28% 8%,38% 8%,38% 45%,50% 45%,50% 25%,62% 25%,62% 0,72% 0,72% 40%,85% 40%,85% 20%,100% 20%,100% 100%,0 100%)}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffffffad 1px,transparent 1px);background-size:47px 67px;opacity:.45;animation:twinkle 3s infinite alternate}.halo{position:absolute;top:22%;left:50%;transform:translateX(-50%);width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#ffe6f46b,transparent 70%);animation:pulse 4s ease-in-out infinite}.avatar{position:relative;margin:10vh auto 0;width:160px;height:215px;filter:drop-shadow(0 0 24px #f3c5ec);animation:rise 2s ease-out both}.avatar:before{content:"";position:absolute;left:42px;top:0;width:76px;height:82px;border-radius:48% 48% 44% 44%;background:#17142b;box-shadow:0 -9px 0 8px #1b172d}.avatar:after{content:"";position:absolute;left:8px;bottom:0;width:144px;height:145px;border-radius:80px 80px 20px 20px;background:linear-gradient(135deg,#26203f,#0d1029)}.stage.cool .avatar{filter:drop-shadow(0 0 24px #9fdcff)}.stage.sun .avatar{filter:drop-shadow(0 0 24px #ffe2a1)}.content{z-index:2;position:relative}.eyebrow{font-size:12px;letter-spacing:.25em;color:#eac9ed}.name{font-size:32px;margin:12px 0}.line{min-height:56px;font-size:18px;line-height:1.8;transition:opacity .4s}.controls{position:relative;z-index:2}.track{height:6px;border-radius:10px;background:#ffffff33;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#a8d8ff,#ffbde5);transition:width .35s}.meta{display:flex;justify-content:space-between;font-size:12px;color:#e0d9eb}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;padding-bottom:max(20px,env(safe-area-inset-bottom))}button,select{border:1px solid #ffffff66;border-radius:999px;background:#ffffff18;color:white;padding:10px 15px;font:inherit}select{background:#242139}button:focus-visible,select:focus-visible{outline:3px solid #fff}button:disabled{opacity:.45}.primary{background:#dca7d3;color:#191125;border:0;font-weight:700}.note{font-size:11px;opacity:.7;margin-top:15px}@keyframes pulse{50%{opacity:.5;transform:translateX(-50%) scale(1.2)}}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes twinkle{to{opacity:.2}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
 .download-choice{margin:12px 0;padding:12px;border:1px solid #ffffff40;border-radius:14px;background:#21192dcf;text-align:left;font-size:12px}.download-choice p{margin:4px 0 10px}.download-choice .choices{display:flex;gap:6px;flex-wrap:wrap}.download-choice button{font-size:12px;padding:9px 11px}.download-choice[hidden]{display:none}.demo-chat{margin-top:14px;background:#ffffff19;border-radius:16px;padding:15px;text-align:left}.demo-chat[hidden]{display:none}.demo-chat p{line-height:1.7}.demo-chat .thread{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}.demo-chat .msg{padding:9px 12px;border-radius:14px;background:#ffffff20;align-self:flex-start;max-width:90%;font-size:14px}.demo-chat .msg.me{background:#db9bc155;align-self:flex-end}.demo-chat form{display:flex;gap:7px}.demo-chat input{min-width:0;flex:1;border:1px solid #ffffff66;background:#16172a;color:white;border-radius:20px;padding:12px;font-size:16px}.demo-chat form button{white-space:nowrap}.demo-chat small{opacity:.8} </style></head><body><main class="stage" id="stage"><div class="stars" aria-hidden="true"></div><div class="skyline" aria-hidden="true"></div><div class="halo" aria-hidden="true"></div><div class="content"><div class="eyebrow">A NEW STORY BEGINS</div><div class="avatar" aria-hidden="true"></div><h1 class="name" id="name">美咲</h1><p class="line" id="line" aria-live="polite"></p></div><div class="controls"><label for="character">出会うキャラクター：</label><select id="character"><option value="misaki">美咲（桜）</option><option value="cool">クール系（仮）</option><option value="sun">元気系（仮）</option></select><div class="download-choice" id="download-choice"><b>🌸 ローカルAIの準備方法</b><p>約130MBのモデル取得は任意。モバイル通信で2分以上かかることがあります。選択してもこの試作ではダウンロードしません。</p><div class="choices"><button type="button" data-policy="wifi">Wi-Fiで準備</button><button type="button" data-policy="mobile">モバイル通信も許可</button><button type="button" data-policy="later">あとで決める</button></div><p id="policy-status" role="status">未選択（あとで決める扱い）</p></div><div class="track" role="progressbar" aria-label="オープニング演出の進行" aria-valuemin="0" aria-valuemax="100" id="track"><div class="bar" id="bar"></div></div><div class="meta"><span id="status">デモ準備中</span><span id="percent">0%</span></div><div class="buttons"><button id="skip">演出をスキップ</button><button id="next">次の場面</button><button class="primary" id="ready" disabled>会話へ</button><button id="restart">最初から</button><button id="back" type="button">ラウンジへ戻る</button></div><div class="demo-chat" id="demo-chat" hidden><b>美咲 🌸</b><div class="thread" id="thread" aria-live="polite"><div class="msg">来てくれてありがとう。ここからお話ししようね🌸</div></div><form id="chat-form"><input id="chat-input" maxlength="180" placeholder="美咲に話しかけてみる…" aria-label="美咲へのメッセージ"><button type="submit">送る</button></form><small>会話画面の動線を確認するための仮画面です。入力に応じた定型返答のみ。Gemini通信・会話保存は行いません。</small><p><button type="button" id="again">ラウンジに戻る</button></p></div><p class="note">20秒のオープニング演出試作。ゲージは演出時間でありAIのダウンロード進捗ではありません。実際のAI読込・会話遷移は未接続です。</p></div></main>
<script>
const characters={misaki:{name:'美咲',theme:'',lines:['たくさんの言葉の中から……','あなたとの時間を、大切にしたい。','桜の光の向こうに、あなたが見える。','……聞こえる？ やっと、会えたね🌸']},cool:{name:'クール系（仮）',theme:'cool',lines:['静かな夜に、物語が始まる。','記憶の光が、街を照らす。','……ずっと、ここにいた。','待ってたよ。']},sun:{name:'元気系（仮）',theme:'sun',lines:['新しい朝がやってきた！','きらきらした思い出を集めよう。','もうすぐ会えるね！','お待たせー！ さあ、始めよっ！']}};
const entry=new URLSearchParams(location.search);const fromLounge=entry.get('from')==='lounge';const selected=entry.get('character');const $=id=>document.getElementById(id);if(fromLounge&&selected&&Object.prototype.hasOwnProperty.call(characters,selected)){$('character').value=selected;const label=document.querySelector('label[for="character"]');if(label)label.hidden=true;$('character').hidden=true;}let scene=0,progress=0,finished=false,timer,startAt=0;const key='misaki-lab-opening-seen-v1',policyKey='misaki-lab-model-policy-v1';let returning=false;try{returning=localStorage.getItem(key)==='yes'}catch{}const DURATION=returning?2500:20000;const policyLabels={wifi:'Wi-Fi接続時に準備（未実装）',mobile:'モバイル通信も許可（未実装）',later:'あとで決める'};function policyRender(){let value='later';try{value=localStorage.getItem(policyKey)||'later'}catch{}$('policy-status').textContent='選択：'+(policyLabels[value]||policyLabels.later)}document.querySelectorAll('[data-policy]').forEach(b=>b.addEventListener('click',()=>{try{localStorage.setItem(policyKey,b.dataset.policy)}catch{}policyRender()}));policyRender();
function render(){const c=characters[$('character').value];$('stage').className='stage '+c.theme;$('name').textContent=c.name;$('line').textContent=c.lines[scene];$('bar').style.width=progress+'%';$('percent').textContent=Math.round(progress)+'%';$('track').setAttribute('aria-valuenow',Math.round(progress));$('status').textContent=finished?'演出完了 🌸':'出会いの物語 '+Math.ceil((DURATION*(1-progress/100))/1000)+'秒';$('ready').disabled=!finished;$('ready').textContent=finished?'会話へ（デモ）':'演出中…';$('next').disabled=finished;}
function tick(){const elapsed=Math.min(DURATION,performance.now()-startAt);progress=elapsed/DURATION*100;scene=Math.min(3,Math.floor(elapsed/(DURATION/4)));if(elapsed>=DURATION){finished=true;clearInterval(timer)}render()}
function reset(){clearInterval(timer);scene=0;progress=0;finished=false;startAt=performance.now();render();timer=setInterval(tick,100)}
$('character').addEventListener('change',reset);$('next').addEventListener('click',()=>{if(!finished){startAt-=DURATION/4;tick()}});$('skip').addEventListener('click',()=>{clearInterval(timer);progress=100;scene=3;finished=true;render();enterDemoChat()});$('restart').addEventListener('click',reset);$('back').addEventListener('click',()=>{location.href='../character-lounge/index.html'});function enterDemoChat(){if(!finished)return;try{localStorage.setItem(key,'yes')}catch{}$('demo-chat').hidden=false;$('download-choice').hidden=true;$('ready').hidden=true;$('skip').hidden=true;$('next').hidden=true;$('line').textContent='……これから、よろしくね🌸'}$('ready').addEventListener('click',enterDemoChat);const responses=['うん、聞いてるよ。もっと話して？🌸','そうなんだね。美咲にも教えてくれてありがとう。','ここで一緒に過ごせるの、うれしいな🌸'];let responseIndex=0;function addMessage(value,mine){const d=document.createElement('div');d.className='msg'+(mine?' me':'');d.textContent=value;$('thread').appendChild(d);$('thread').scrollTop=$('thread').scrollHeight}$('chat-form').addEventListener('submit',e=>{e.preventDefault();const input=$('chat-input');const value=input.value.trim();if(!value)return;addMessage(value,true);input.value='';addMessage(responses[responseIndex++%responses.length],false)});$('again').addEventListener('click',()=>{location.href='../character-lounge/index.html'});reset();
</script></body></html>
