<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>美咲・アメふる 日本語開発履歴</title>
<style>
:root{font:16px/1.65 system-ui,-apple-system,sans-serif;color:#1d3048;background:#f4f6fb}*{box-sizing:border-box}body{max-width:1060px;margin:auto;padding:22px 16px 80px}header{padding:12px 0 22px}h1{font-size:clamp(26px,5vw,36px);line-height:1.35;margin:12px 0}h2{font-size:19px;line-height:1.5;margin:0 0 10px}a{color:#154eaf}small,.muted{color:#526278}.search{position:sticky;top:0;background:#f4f6fb;padding:12px 0;z-index:1}input,select,button{font:inherit;border:1px solid #bdc8da;border-radius:10px;background:white;padding:12px}input{width:100%;font-size:18px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.filters select{flex:1;min-width:140px}article{border:1px solid #dce3ee;border-radius:16px;background:white;padding:20px;margin:14px 0;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:6px;padding:2px 8px;background:#e8eef9;font-size:13px;margin:0 6px 8px 0}details{margin-top:12px}summary{cursor:pointer;color:#154eaf}p{margin:10px 0}.error{color:#9e2929}.actions{display:flex;gap:18px;flex-wrap:wrap}#more{width:100%;margin-top:16px}#status{white-space:pre-line}.zero{padding:30px;text-align:center}.hint{background:#eaf0fb;padding:12px 16px;border-radius:10px}
</style></head><body>
<header><a href="./">承認ボード</a> ／ <a href="https://github.com/miyazaki1016/misaki/blob/main/docs/DEVELOPMENT_MANAGEMENT_OVERVIEW.md">開発管理総覧</a><h1>何を作り、何が分かったか。</h1><p>美咲・アメふるの日本語開発履歴。新しく着手する前に、過去のコード・実験・未解決事項を探します。</p><p class="hint">履歴は過去の根拠です。実装の存在・検証成功・main統合・本番反映は、それぞれ別に確認します。</p><div id="status" role="status">両プロジェクトの履歴を読み込んでいます…</div></header>
<section class="search" aria-label="履歴検索"><input id="query" type="search" placeholder="例：z4 stride 47 ／ 記憶 会話" aria-label="機能名・作業内容・キーワード"><div class="filters"><select id="repo" aria-label="プロジェクト"><option value="">両プロジェクト</option value="misaki">美咲</option><option value="emergencyalert">アメふる</option></select><select id="state" aria-label="状態"><option value="">すべてのPR・ブランチ</option value="unmerged">main統合未確認のPR・研究</option><option value="merged">main統合確認済みPR（本番は別）</option><option value="branch">作業ブランチ</option></select><button id="copy" type="button">着手前の確認結果をコピー</button></div><small>空白区切りで絞り込み。日本語見出し・過去の結論・PR原文・コード名・関連資料を検索します。</small><div id="count" aria-live="polite"></div></section><main id="results"></main><button id="more" type="button" hidden>続きを表示</button>
<script>
'use strict';
const repositories=['misaki','emergencyalert'];const names={misaki:'美咲',emergencyalert:'アメふる'};
const el=id=>document.getElementById(id);let all=[],matched=[],limit=30;
function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n}
function evidenceURL(c){return 'https://github.com/miyazaki1016/'+c.repo+'/blob/development-history/docs/work-history/cases/'+encodeURIComponent(c.id)+'.md'}
function filtered(){const terms=el('query').value.toLowerCase().trim().split(/\s+/).filter(Boolean);return all.filter(c=>(!el('repo').value||c.repo===el('repo').value)&&(!el('state').value||(el('state').value==='unmerged'&&c.id.startsWith('pr-')&&!c.main_status?.startsWith('mainに祖先コミットとして存在'))||(el('state').value==='merged'&&c.main_status?.startsWith('mainに祖先コミットとして存在'))||(el('state').value==='branch'&&c.id.startsWith('branch-')))&&terms.every(t=>c.search_text.toLowerCase().includes(t)))}
function render(reset=true){if(reset)limit=30;matched=filtered();const target=el('results');target.replaceChildren();el('count').textContent=matched.length+'件 ／ 全'+all.length+'件';for(const c of matched.slice(0,limit)){const article=node('article');article.append(node('span',names[c.repo],'badge'),node('span',c.state||'未確認','badge'),node('h2',c.summary||c.title),node('small',c.title),node('p','main：'+(c.main_status||'未確認')));const details=node('details'),summary=node('summary','過去の結論・残課題を読む');details.append(summary,node('p',c.conclusion||'結論は原本を確認'),node('p','残課題：'+(c.remaining||'原本の受入条件・未解決事項を照合')),node('p','次の作業：'+(c.next||'受入条件を確認')),node('p','本番反映：未確認'));article.append(details);const link=node('a','コード・差分・テスト・資料の根拠');link.href=evidenceURL(c);link.target='_blank';link.rel='noopener';article.append(link);target.append(article)}if(!matched.length)target.append(node('p','一致する履歴がありません。別の表記やコード名でも検索し、未取得の資料がないか確認してください。','zero'));el('more').hidden=matched.length<=limit;const params=new URLSearchParams();if(el('query').value)params.set('q',el('query').value);if(el('repo').value)params.set('repo',el('repo').value);history.replaceState(null,'',location.pathname+(params.size?'?'+params:''))}
async function load(){const messages=[];await Promise.all(repositories.map(async repo=>{try{const response=await fetch('https://raw.githubusercontent.com/miyazaki1016/'+repo+'/development-history/docs/work-history/search-index.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.cases)||data.repository!=='miyazaki1016/'+repo)throw Error('索引形式の不一致');all.push(...data.cases.map(c=>({...c,repo})));messages.push(names[repo]+'：'+data.cases.length+'案件・更新 '+new Date(data.generated_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+(data.coverage.errors.length?'（収集エラーあり）':''))}catch(error){messages.push(names[repo]+'：取得できません（'+error.message+'）。GitHubの履歴資料も確認してください。');el('status').classList.add('error')}}));all.sort((a,b)=>a.repo.localeCompare(b.repo)||a.id.localeCompare(b.id,undefined,{numeric:true}));el('status').textContent=messages.join('\n');render()}
el('query').addEventListener('input',()=>render());el('repo').addEventListener('change',()=>render());el('state').addEventListener('change',()=>render());el('more').addEventListener('click',()=>{limit+=30;render(false)});el('copy').addEventListener('click',async()=>{const text='新規着手前の既存成果確認\n検索語：'+el('query').value+'\n'+matched.slice(0,15).map(c=>names[c.repo]+'：'+c.summary+'\n既存結論：'+c.conclusion+'\n次の作業：'+c.next+'\n'+evidenceURL(c)).join('\n\n')+'\n同じ実装・測定を繰り返す前に、既存コード・結論・未解決事項を照合する。本番反映は別途確認。';try{await navigator.clipboard.writeText(text);el('copy').textContent='確認結果をコピーしました'}catch{el('status').textContent='コピーできませんでした。根拠リンクから確認してください。'}});const params=new URLSearchParams(location.search);el('query').value=params.get('q')||'';if(repositories.includes(params.get('repo')))el('repo').value=params.get('repo');load();
</script></body></html>
