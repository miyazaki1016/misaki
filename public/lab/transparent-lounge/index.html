<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美咲ラウンジ｜スワイプ試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#211b25;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:860px;margin:auto;padding:18px}h1{font-size:22px}p{line-height:1.65;color:#e6dbe2}.stage{position:relative;overflow:hidden;border-radius:22px;aspect-ratio:4/3;min-height:290px;background:radial-gradient(ellipse at 70% 18%,#a67e6a88,transparent 42%),linear-gradient(#5e4a50,#302a35);touch-action:pan-y;user-select:none}.light{position:absolute;top:10%;left:10%;width:12px;height:50px;background:#f3c78c;border-radius:20px;box-shadow:0 0 30px 14px #f3c78c66}.sofa{position:absolute;left:5%;right:5%;bottom:0;height:38%;border-radius:40% 40% 0 0;background:linear-gradient(#a48a8c,#79646d)}.track{position:absolute;inset:0}.card{position:absolute;left:50%;bottom:0;width:70%;height:100%;border:0;padding:0;background:transparent;color:white;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform .35s ease,opacity .35s ease;transform-origin:center bottom;cursor:pointer}.card img{width:100%;height:94%;object-fit:contain;object-position:center bottom;pointer-events:none;filter:drop-shadow(0 6px 6px #0005)}.card .name{font-size:15px;background:#2a2026cc;padding:5px 14px;border-radius:30px;margin-bottom:8px}.card[data-slot="center"]{transform:translateX(-50%) scale(1);z-index:3;opacity:1}.card[data-slot="left"]{transform:translateX(-115%) scale(.72);z-index:2;opacity:.78}.card[data-slot="right"]{transform:translateX(15%) scale(.72);z-index:2;opacity:.78}.placeholder{height:75%;width:70%;border-radius:48% 48% 12% 12%;background:linear-gradient(#b6a4aa,#766775);display:flex;align-items:center;justify-content:center;font-size:64px;opacity:.85}.controls{display:flex;justify-content:center;gap:12px;margin:16px 0}.controls button,#close{border:1px solid #aa91a2;background:#624d62;color:#fff;border-radius:12px;min-height:44px;padding:9px 16px;font-size:16px}.hint{text-align:center;font-size:14px}.dots{text-align:center;font-size:21px;letter-spacing:8px;color:#d9b9c8}dialog{border:1px solid #a78c9f;border-radius:18px;background:#423340;color:white;padding:24px;max-width:85%}dialog::backdrop{background:#000a}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><main><h1>🌸 美咲ラウンジ｜スワイプ試作</h1><p>左右にスワイプすると、中央の女の子が切り替わるよ。左右の子は仮表示。中央をタップして選択してね。</p><section class="stage" id="stage" aria-label="女の子を左右に切り替える"><div class="light"></div><div class="sofa"></div><div class="track" id="track">
<button class="card" data-id="0" data-slot="left" aria-label="女の子Aを中央に"><div class="placeholder">🌷</div><span class="name">女の子A（仮）</span></button>
<button class="card" data-id="1" data-slot="center" aria-label="美咲を選択"><img src="/lab/transparent-lounge/misaki-alpha.webp" alt="美咲の透過アニメーション"><span class="name">美咲</span></button>
<button class="card" data-id="2" data-slot="right" aria-label="女の子Bを中央に"><div class="placeholder">🌼</div><span class="name">女の子B（仮）</span></button>
</div></section><div class="controls"><button id="prev" type="button">← 左の子</button><button id="choose" type="button">中央の子を選ぶ</button><button id="next" type="button">右の子 →</button></div><div class="dots" id="dots" aria-live="polite">● ○ ○</div><p class="hint">※動画素材があるのは美咲だけ。ほかの子は操作検証用の仮表示です。<br>※本番のチャットにはまだ接続していません。</p></main><dialog id="dialog"><h2 id="chosen">美咲を選択</h2><p>タップ操作の確認ができたよ 🌸</p><button id="close" type="button">閉じる</button></dialog><script>
(()=>{const cards=[...document.querySelectorAll('.card')],names=['女の子A（仮）','美咲','女の子B（仮）'];let current=1,startX=null;const stage=document.querySelector('#stage'),dialog=document.querySelector('#dialog');function render(){cards.forEach((c,i)=>{const delta=(i-current+3)%3;c.dataset.slot=delta===0?'center':delta===1?'right':'left';c.setAttribute('aria-label',names[i]+(delta===0?'を選択':'を中央に'))});document.querySelector('#dots').textContent=names.map((_,i)=>i===current?'●':'○').join(' ')}function move(n){current=(current+n+3)%3;render()}function select(){document.querySelector('#chosen').textContent=names[current]+'を選択';dialog.showModal()}cards.forEach((c,i)=>c.addEventListener('click',()=>i===current?select():(current=i,render())));document.querySelector('#prev').addEventListener('click',()=>move(-1));document.querySelector('#next').addEventListener('click',()=>move(1));document.querySelector('#choose').addEventListener('click',select);document.querySelector('#close').addEventListener('click',()=>dialog.close());stage.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;startX=null;if(Math.abs(dx)>45)move(dx<0?1:-1)},{passive:true});render()})();
</script></body></html>
