<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美咲ラウンジ｜スワイプ試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#211b25;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:860px;margin:auto;padding:18px}h1{font-size:22px}p{line-height:1.65;color:#e6dbe2}.stage{position:relative;overflow:hidden;border-radius:22px;aspect-ratio:4/3;min-height:290px;background:radial-gradient(ellipse at 70% 18%,#a67e6a88,transparent 42%),linear-gradient(#5e4a50,#302a35);touch-action:pan-y;user-select:none}.lounge-bg{position:absolute;inset:0;width:100%;height:100%;display:block}.light{position:absolute;top:10%;left:10%;width:12px;height:50px;background:#f3c78c;border-radius:20px;box-shadow:0 0 30px 14px #f3c78c66}.sofa{position:absolute;left:5%;right:5%;bottom:0;height:38%;border-radius:40% 40% 0 0;background:linear-gradient(#a48a8c,#79646d)}.track{position:absolute;inset:0}.card{position:absolute;left:50%;bottom:0;width:94%;height:112%;border:0;padding:0;background:transparent;color:white;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform .35s ease,opacity .35s ease;transform-origin:center bottom;cursor:pointer}.card img{width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none;filter:drop-shadow(0 6px 6px #0005)}.card .name{font-size:15px;background:#2a2026cc;padding:5px 14px;border-radius:30px;margin-bottom:8px}.card[data-slot="center"]{transform:translateX(-50%) scale(1);z-index:3;opacity:1}.card[data-slot="left"]{transform:translateX(-104%) scale(.57);z-index:2;opacity:.78}.card[data-slot="right"]{transform:translateX(4%) scale(.57);z-index:2;opacity:.78}.placeholder{height:75%;width:70%;border-radius:48% 48% 12% 12%;background:linear-gradient(#b6a4aa,#766775);display:flex;align-items:center;justify-content:center;font-size:64px;opacity:.85}.controls{display:flex;justify-content:center;gap:12px;margin:16px 0}.controls button,#close{border:1px solid #aa91a2;background:#624d62;color:#fff;border-radius:12px;min-height:44px;padding:9px 16px;font-size:16px}.hint{text-align:center;font-size:14px}.dots{text-align:center;font-size:21px;letter-spacing:8px;color:#d9b9c8}dialog{border:1px solid #a78c9f;border-radius:18px;background:#423340;color:white;padding:24px;max-width:85%}dialog::backdrop{background:#000a}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><main><h1>🌸 美咲ラウンジ｜スワイプ試作</h1><p>左右にスワイプすると、中央の女の子が切り替わるよ。左右の子は仮表示。中央をタップして選択してね。</p><section class="stage" id="stage" aria-label="女の子を左右に切り替える"><svg class="lounge-bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#4b3c42"/><stop offset="1" stop-color="#88716b"/></linearGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#111d34"/><stop offset="1" stop-color="#39445b"/></linearGradient><linearGradient id="couch" x2="0" y2="1"><stop stop-color="#77666b"/><stop offset="1" stop-color="#483b45"/></linearGradient><radialGradient id="glow"><stop stop-color="#ffca8c" stop-opacity=".55"/><stop offset="1" stop-color="#ffca8c" stop-opacity="0"/></radialGradient></defs><rect width="800" height="600" fill="url(#wall)"/><rect x="0" y="0" width="800" height="445" fill="#392e37" opacity=".28"/><rect x="105" y="34" width="590" height="335" rx="7" fill="#241f2a" stroke="#ad9386" stroke-width="13"/><rect x="121" y="49" width="558" height="304" fill="url(#sky)"/><circle cx="556" cy="111" r="25" fill="#f2e0ba" opacity=".8"/><g fill="#151d2e"><path d="M121 270h75v-90h49v90h37v-130h56v130h42v-60h53v60h47v-108h69v108h53v-74h44v74h33v83H121z"/></g><g fill="#edc58d" opacity=".65"><path d="M214 202h5v9h-5zm15 20h5v9h-5zm72-58h5v9h-5zm24 31h5v9h-5zm70 42h5v9h-5zm103-51h5v9h-5zm24 23h5v9h-5zm48 18h5v9h-5zm45-11h5v9h-5z"/></g><path d="M400 49v304M121 351h558" stroke="#8f7c77" stroke-width="10"/><ellipse cx="400" cy="570" rx="360" ry="60" fill="#241e28" opacity=".6"/><path d="M64 520v-85q0-75 85-75h502q85 0 85 75v85z" fill="url(#couch)" stroke="#a68d86" stroke-width="7"/><path d="M95 450q0-50 70-50h470q70 0 70 50v72H95z" fill="#8e7a7a"/><path d="M90 508q0-34 60-34h500q60 0 60 34v92H90z" fill="#67545b"/><path d="M310 472v125M492 472v125" stroke="#4d404b" stroke-width="5" opacity=".6"/><path d="M90 489q-47-5-47 44v67h65v-88zm620 0q47-5 47 44v67h-65v-88z" fill="#564550"/><rect x="122" y="410" width="90" height="75" rx="15" fill="#ac8b83" transform="rotate(-9 167 448)"/><rect x="594" y="410" width="90" height="75" rx="15" fill="#b39a8b" transform="rotate(9 639 448)"/><ellipse cx="55" cy="265" rx="110" ry="150" fill="url(#glow)"/><ellipse cx="746" cy="270" rx="110" ry="150" fill="url(#glow)"/><path d="M43 340V210m-24 0h48l-12-45H31zM755 340V210m-24 0h48l-12-45h-24z" stroke="#c5a887" stroke-width="8" fill="#dfb67b"/><path d="M0 595h800" stroke="#ab8a7b" stroke-width="10"/></svg><div class="track" id="track">
<button class="card" data-id="0" data-slot="left" aria-label="女の子Aを中央に"><div class="placeholder">🌷</div><span class="name">女の子A（仮）</span></button>
<button class="card" data-id="1" data-slot="center" aria-label="美咲を選択"><img src="/lab/transparent-lounge/misaki-alpha.webp" alt="美咲の透過アニメーション"><span class="name">美咲</span></button>
<button class="card" data-id="2" data-slot="right" aria-label="女の子Bを中央に"><div class="placeholder">🌼</div><span class="name">女の子B（仮）</span></button>
</div></section><div class="controls"><button id="prev" type="button">← 左の子</button><button id="choose" type="button">中央の子を選ぶ</button><button id="next" type="button">右の子 →</button></div><div class="dots" id="dots" aria-live="polite">● ○ ○</div><p class="hint">※動画素材があるのは美咲だけ。ほかの子は操作検証用の仮表示です。<br>※本番のチャットにはまだ接続していません。</p></main><dialog id="dialog"><h2 id="chosen">美咲を選択</h2><p>タップ操作の確認ができたよ 🌸</p><button id="close" type="button">閉じる</button></dialog><script>
(()=>{const cards=[...document.querySelectorAll('.card')],names=['女の子A（仮）','美咲','女の子B（仮）'];let current=1,startX=null;const stage=document.querySelector('#stage'),dialog=document.querySelector('#dialog');function render(){cards.forEach((c,i)=>{const delta=(i-current+3)%3;c.dataset.slot=delta===0?'center':delta===1?'right':'left';c.setAttribute('aria-label',names[i]+(delta===0?'を選択':'を中央に'))});document.querySelector('#dots').textContent=names.map((_,i)=>i===current?'●':'○').join(' ')}function move(n){current=(current+n+3)%3;render()}function select(){document.querySelector('#chosen').textContent=names[current]+'を選択';dialog.showModal()}cards.forEach((c,i)=>c.addEventListener('click',()=>i===current?select():(current=i,render())));document.querySelector('#prev').addEventListener('click',()=>move(-1));document.querySelector('#next').addEventListener('click',()=>move(1));document.querySelector('#choose').addEventListener('click',select);document.querySelector('#close').addEventListener('click',()=>dialog.close());stage.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;startX=null;if(Math.abs(dx)>45)move(dx<0?1:-1)},{passive:true});render()})();
</script></body></html>
