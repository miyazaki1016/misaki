<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美咲・透過動画テスト</title><style>body{margin:0;background:#201820;color:white;font-family:system-ui;padding:18px}main{max-width:900px;margin:auto}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 75% 25%,#b88e72,transparent 35%),linear-gradient(145deg,#69515b,#3d3446)}.sofa{position:absolute;bottom:-7%;left:5%;width:90%;height:45%;background:#977d83;border-radius:30% 30% 0 0}.person{position:absolute;inset:0;border:0;background:none;width:100%;padding:0}.person video{width:100%;height:100%;object-fit:contain;pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}button,.upload{background:#60455d;color:white;border:1px solid #aa8a9f;border-radius:12px;padding:12px;font-size:15px}input{display:none}p{line-height:1.7}#dialog{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}#dialog.on{display:flex}.card{padding:25px;border-radius:18px;background:#4b3548;text-align:center}</style></head><body><main><h2>🌸 美咲ラウンジ｜透過動画検証</h2><p>iPhoneで透過WebMを読み込み、背景との重なり・ループ・タップを確認する実験ページです。</p><label class="upload">📁 MuseのWebMを選択<input id="file" type="file" accept=".webm,video/webm"></label><div class="stage"><div class="sofa"></div><button class="person" id="person" aria-label="美咲を選択"><video id="video" muted autoplay loop playsinline></video></button></div><div class="controls"><button id="play">▶ 再生</button><button id="pause">⏸ 停止</button></div><p id="status">WebMを選ぶと再生が始まります。ファイルは端末内だけで読み込み、サーバーには送信しません。</p><p>確認ポイント：①背景が透明に抜けるか ②動画が動くか ③つなぎ目が自然か ④美咲をタップできるか。これは実験用で、本番には影響しません。</p></main><div id="dialog"><div class="card"><h2>🌸 美咲を選択したよ！</h2><button id="close">閉じる</button></div></div><script>const f=document.querySelector('#file'),v=document.querySelector('#video'),s=document.querySelector('#status');let u;f.onchange=()=>{if(u)URL.revokeObjectURL(u);const x=f.files[0];if(!x)return;u=URL.createObjectURL(x);v.src=u;v.play().then(()=>s.textContent='再生中：'+x.name).catch(()=>s.textContent='再生できません。iPhone SafariのWebM対応を確認してください。')};v.onerror=()=>s.textContent='動画の読み込みに失敗しました。';document.querySelector('#play').onclick=()=>v.play().catch(()=>s.textContent='再生できません');document.querySelector('#pause').onclick=()=>v.pause();document.querySelector('#person').onclick=()=>document.querySelector('#dialog').classList.add('on');document.querySelector('#close').onclick=()=>document.querySelector('#dialog').classList.remove('on');</script></body></html>
