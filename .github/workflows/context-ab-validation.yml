name: Context AB validation
on:
  push:
    branches:
      - work/context-no-duplicate-replies-ab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --experimental-strip-types scripts/context-ab-smoke.ts
      - run: npx tsc --noEmit
