name: Legacy maintenance drain
on:
  pull_request:
  push:
    branches: [codex/legacy-maintenance-drain]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17.6', '18.4']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55438:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: npx tsc --noEmit --incremental false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check --no-config --node-modules-dir=none supabase/functions/body-clock/index.ts

