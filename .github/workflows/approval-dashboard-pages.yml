name: Approval dashboard (GitHub Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/approval-dashboard/**'
      - '.github/workflows/approval-dashboard-pages.yml'
      - 'scripts/check_approval_dashboard.py'
  pull_request:
    paths:
      - 'docs/approval-dashboard/**'
      - '.github/workflows/approval-dashboard-pages.yml'
      - 'scripts/check_approval_dashboard.py'
concurrency:
  group: approval-dashboard-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML and JavaScript without network
        run: python3 scripts/check_approval_dashboard.py
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload dashboard only (no app files)
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/approval-dashboard
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
