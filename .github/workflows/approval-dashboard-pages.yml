name: Approval dashboard (GitHub Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/approval-dashboard/**'
      - '.github/workflows/approval-dashboard-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: approval-dashboard-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload dashboard only (no app files)
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/approval-dashboard
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
