name: Canonical relationship integration tests
on:
  pull_request:
    branches: [codex/server-canonical-foundation]
  push:
    branches: [sora/canonical-relationship-integration]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
