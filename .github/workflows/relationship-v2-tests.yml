name: PR relationship v2 tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [sora/relationship-time-v2-design]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
